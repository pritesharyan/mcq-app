<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Higher Grade Pay - ITI</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="card auth-card">
    <h2 id="formTitle">Login</h2>

    <form id="loginForm">
      <input type="text" id="loginUsername" placeholder="Username" required autocomplete="username">
      <input type="password" id="loginPassword" placeholder="Password" required autocomplete="current-password">
      <button type="submit">Login</button>
    </form>

    <form id="registerForm" class="hidden">
      <input type="text" id="regName" placeholder="Full name" required>
      <input type="text" id="regUsername" placeholder="Username" required>
      <input type="tel" id="regMobile" placeholder="Mobile number (optional)">
      <input type="email" id="regEmail" placeholder="Email (required — used to recover your username/password)" required>
      <input type="password" id="regPassword" placeholder="Password (min 6 characters)" required autocomplete="new-password">
      <input type="password" id="regConfirmPassword" placeholder="Confirm password" required autocomplete="new-password">
      <button type="submit">Register</button>
    </form>

    <form id="forgotForm" class="hidden">
      <p style="font-size:13px;color:#666">Enter your registered email. We'll send your username and a new password to it.</p>
      <input type="email" id="forgotEmail" placeholder="Your registered email" required>
      <button type="submit">Send my login details</button>
    </form>

    <p><a href="#" id="toggleMode">Need an account? Register</a></p>
    <p><a href="#" id="forgotToggle">Forgot username or password?</a></p>
    <p id="msg" class="error"></p>
    <p style="font-size:12px;color:#888">Default master admin: admin / admin123</p>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
